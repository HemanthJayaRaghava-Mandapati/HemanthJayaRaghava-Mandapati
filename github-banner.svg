<svg width="1200" height="440" viewBox="0 0 1200 440"
     fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- BACKGROUND -->

  <linearGradient id="bg"
                  x1="0" y1="0"
                  x2="1200" y2="440"
                  gradientUnits="userSpaceOnUse">

    <stop stop-color="#020617"/>
    <stop offset="0.5" stop-color="#0B1733"/>
    <stop offset="1" stop-color="#1A1233"/>

  </linearGradient>


  <!-- BLUE + PURPLE GLOW -->

  <radialGradient id="core">

    <stop offset="0"
          stop-color="#F3E8FF"/>

    <stop offset="0.25"
          stop-color="#C084FC"/>

    <stop offset="0.55"
          stop-color="#38BDF8"/>

    <stop offset="1"
          stop-color="#38BDF8"
          stop-opacity="0"/>

  </radialGradient>


  <!-- GRID -->

  <pattern id="grid"
           width="32"
           height="32"
           patternUnits="userSpaceOnUse">

    <path d="M32 0H0V32"
          stroke="#38BDF8"
          stroke-opacity=".055"/>

  </pattern>


  <!-- GLOW -->

  <filter id="glow"
          x="-100%"
          y="-100%"
          width="300%"
          height="300%">

    <feGaussianBlur
      stdDeviation="5"
      result="blur"/>

    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>

  </filter>


  <!-- ANIMATIONS -->

  <style>

    .mono {
      font-family: "Courier New", monospace;
    }

    .title {
      font: 700 42px "Courier New", monospace;
      letter-spacing: 3px;
    }

    .subtitle {
      font: 700 17px "Courier New", monospace;
      letter-spacing: 2px;
    }

    .small {
      font: 13px "Courier New", monospace;
    }

    .tiny {
      font: 11px "Courier New", monospace;
    }

    .flow {
      stroke-dasharray: 12 18;
      animation: flow 2.3s linear infinite;
    }

    .pulse1 {
      animation: pulse 2.4s ease-in-out infinite;
      transform-origin: center;
    }

    .pulse2 {
      animation: pulse 2.4s ease-in-out infinite .8s;
      transform-origin: center;
    }

    .pulse3 {
      animation: pulse 2.4s ease-in-out infinite 1.6s;
      transform-origin: center;
    }

    .float1 {
      animation: float 4.5s ease-in-out infinite;
    }

    .float2 {
      animation: float 4.5s ease-in-out infinite .9s;
    }

    .float3 {
      animation: float 4.5s ease-in-out infinite 1.8s;
    }

    .scan {
      animation: scan 3.2s ease-in-out infinite;
    }

    .blink {
      animation: blink .9s steps(1) infinite;
    }

    .status {
      animation: status 2s ease-in-out infinite;
    }


    @keyframes flow {

      to {
        stroke-dashoffset: -60;
      }

    }


    @keyframes pulse {

      0%,100% {
        opacity: .45;
        transform: scale(.82);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }

    }


    @keyframes float {

      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }

    }


    @keyframes scan {

      0%,100% {
        transform: translateY(0);
        opacity: 0;
      }

      10% {
        opacity: .9;
      }

      50% {
        opacity: .35;
      }

      90% {
        opacity: .9;
      }

      100% {
        transform: translateY(200px);
        opacity: 0;
      }

    }


    @keyframes blink {

      0%,48% {
        opacity: 1;
      }

      49%,100% {
        opacity: 0;
      }

    }


    @keyframes status {

      0%,100% {
        fill: #38BDF8;
      }

      50% {
        fill: #C084FC;
      }

    }

  </style>


  <!-- TERMINAL CLIP -->

  <clipPath id="terminalClip">

    <rect x="835"
          y="145"
          width="290"
          height="230"
          rx="16"/>

  </clipPath>

</defs>


